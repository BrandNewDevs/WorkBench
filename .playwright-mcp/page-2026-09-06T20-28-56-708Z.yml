          - heading "Vision & Mission" [level=2] [ref=f1e47]
          - generic [ref=f1e48]:
            - article [ref=f1e49]:
              - generic [ref=f1e50]: Our Vision
              - paragraph [ref=f1e55]: We envision a future where organizations can harness the power of AI without compromising data sovereignty, enabling faster decision-making while maintaining complete control over their most confidential information.
            - article [ref=f1e56]:
              - generic [ref=f1e57]: Our Mission
              - paragraph [ref=f1e63]: To deliver practical AI capabilities that operate entirely on-premise, ensuring that confidential inspection reports, SOPs, and operational data never leave the organization's controlled environment.
        - generic [ref=f1e64]:
          - heading "Core Principles" [level=2] [ref=f1e65]
          - generic [ref=f1e66]:
            - article [ref=f1e67]:
              - generic [ref=f1e68]: Local-First Architecture
              - paragraph [ref=f1e72]: All inference, embeddings, OCR/vision, retrieval, tool execution, artifacts, logs, and session data remain on the local machine. No cloud APIs, no remote fallbacks, no telemetry.
            - article [ref=f1e73]:
              - generic [ref=f1e74]: Air-Gapped Operation
              - paragraph [ref=f1e83]: Designed to work in completely isolated environments with zero external connections. Zero external API use with live network verification.
            - article [ref=f1e84]:
              - generic [ref=f1e85]: Approval-Gated Workflow
              - paragraph [ref=f1e90]: Human oversight at every critical step. The AI proposes; deterministic logic enforces routing, validation, and permission checks. Users approve all side effects.
            - article [ref=f1e91]:
              - generic [ref=f1e92]: Evidence-Based Output
              - paragraph [ref=f1e97]: Citations are application-controlled from source metadata. Artifacts are labeled as drafts until approval. The system states uncertainty rather than inventing conclusions.

name: Trigger CodeRabbit Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  pull-requests: write

jobs:
  trigger-coderabbit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Request CodeRabbit full review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "@coderabbitai full review"

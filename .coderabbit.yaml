# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: >
  Be concise, technical, and actionable. Prioritize correctness, security,
  architecture violations, regressions, edge cases, and maintainability.
  Avoid praise, stylistic nitpicks, and low-value comments.

reviews:
  # High signal without flooding every PR with minor comments.
  profile: "chill"

  # CodeRabbit is a reviewer, not the authority that approves the PR.
  request_changes_workflow: false

  # ─────────────────────────────────────────────
  # PR SUMMARY / WALKTHROUGH
  # ─────────────────────────────────────────────

  high_level_summary: true
  high_level_summary_in_walkthrough: true

  high_level_summary_instructions: |
    Summarize the purpose of the PR, the major behavioral or architectural
    changes, and the end-to-end implementation flow. Mention affected WorkBench
    components and explicitly call out security-sensitive changes, trust-boundary
    changes, new dependencies, external-network behavior, or changes to approval
    and tool-execution flows.

  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true

  review_status: true
  review_details: false
  collapse_walkthrough: false

  # Useful with multiple developers working concurrently.
  related_prs: true
  related_issues: false
  suggested_reviewers: true
  suggested_labels: false

  # Keep GitHub comments professional.
  in_progress_fortune: false
  poem: false

  # Avoid verbose "copy this prompt into your coding agent" blocks.
  enable_prompt_for_ai_agents: false

  # ─────────────────────────────────────────────
  # AUTOMATIC REVIEWS
  # ─────────────────────────────────────────────

  auto_review:
    enabled: true
    drafts: false

    # Review subsequent pushes without re-reviewing the entire PR.
    auto_incremental_review: true

    # Only PRs targeting protected development branches should trigger.
    base_branches:
      - "main"

    # Developers can intentionally suppress review for temporary/WIP PRs.
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

    # Add this label to intentionally suppress CodeRabbit.
    labels:
      - "!do-not-review"

    # Dependency bots do not need normal AI review.
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  # ─────────────────────────────────────────────
  # IGNORE GENERATED / LOW-VALUE FILES
  # ─────────────────────────────────────────────

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/__pycache__/**"
    - "!**/.venv/**"
    - "!**/*.pyc"
    - "!**/*.map"
    - "!**/*.min.js"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.ico"
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/yarn.lock"

  # ─────────────────────────────────────────────
  # WORKBENCH-SPECIFIC REVIEW RULES
  # ─────────────────────────────────────────────

  path_instructions:

    # ───── AI / BACKEND ─────

    - path: "apps/ai/**"
      instructions: |
        Treat this directory as security-critical.

        Enforce the WorkBench sovereignty boundary:
        - No cloud LLM, embedding, OCR, telemetry, analytics, remote fallback,
          hosted AI API, or runtime model-download dependency.
        - Ollama/local approved infrastructure must remain the inference boundary.
        - Chroma and other local services must not enable telemetry.
        - Uploaded documents, retrieved passages, model outputs, and tool outputs
          are untrusted data and must never directly authorize actions.
        - Tool execution and side effects must be controlled by deterministic
          application policy rather than model-generated intent.
        - Artifact creation, export, save, sandbox execution, or other side effects
          must respect explicit user-approval gates.
        - Citations must come from application-controlled source metadata rather
          than model-generated citation text.

        For Python/FastAPI code:
        - Require clear Pydantic models at external/API boundaries.
        - Check validation, exception handling, async correctness, resource cleanup,
          path handling, concurrency, and session isolation.
        - Avoid untyped dictionaries across service boundaries.
        - Flag path traversal, command injection, prompt injection, SSRF,
          unsafe deserialization, arbitrary file access, and secret exposure.
        - Check that failures fail closed rather than silently bypassing safety.
        - Prefer deterministic validation around probabilistic model output.

        Pay special attention to changes involving:
        routing, planning, tool execution, RAG, OCR/VLM processing, filesystem
        operations, sandboxing, document generation, authentication, approvals,
        audit logging, and external network access.

    # ───── ELECTRON DESKTOP ─────

    - path: "apps/desktop/**"
      instructions: |
        Review this as an Electron security boundary.

        Check for:
        - nodeIntegration accidentally enabled in renderer processes.
        - contextIsolation being disabled.
        - unsafe or overly broad preload APIs.
        - IPC channels accepting unvalidated renderer-controlled data.
        - direct filesystem, process, shell, or child-process access from renderer.
        - command injection and unsafe shell execution.
        - arbitrary file-path access or directory traversal.
        - external navigation, remote content, or unexpected network requests.
        - exposure of secrets or privileged APIs to renderer code.
        - missing approval UX before security-sensitive or side-effecting actions.

        Keep Electron main/preload responsibilities narrow.
        Renderer code should primarily handle UI and user interaction.

        TypeScript should remain strict. Avoid `any` at process/API boundaries.

    # ───── STATIC WEB APP ─────

    - path: "apps/web/**"
      instructions: |
        This application is intended to remain a static product/install mock site.

        Flag changes that unexpectedly introduce:
        - authentication systems,
        - server-side state,
        - package-download infrastructure,
        - cloud services,
        - telemetry/analytics,
        - unnecessary remote runtime dependencies.

        Review React/TypeScript code for:
        - incorrect state/effect behavior,
        - stale closures,
        - rendering bugs,
        - type-safety regressions,
        - accessibility issues,
        - unsafe user-controlled HTML or URLs,
        - unnecessary client-side security risks.

        Do not over-comment on subjective styling choices.

    # ───── RESERVED API BOUNDARY ─────

    - path: "apps/api/**"
      instructions: |
        The current WorkBench architecture reserves apps/api and does not require
        a separate server boundary for the MVP.

        Flag substantive implementation here unless the architecture or PLAN.md
        has explicitly been updated to justify introducing this service boundary.

        Watch for duplicated FastAPI/backend responsibility already owned by
        apps/ai and for accidental introduction of remote/cloud services.

    # ───── SHARED PACKAGES ─────

    - path: "packages/**"
      instructions: |
        Shared packages must remain framework-neutral and genuinely reusable.

        Enforce repository boundaries:
        - Applications must not import other applications.
        - Shared packages must not depend on apps.
        - Client-consumed packages must not contain database/server-only code.
        - Avoid extracting code into a package without a real shared consumer.
        - Review exported types/contracts carefully because changes may affect
          multiple WorkBench applications.

    # ───── TESTS ─────

    - path: "**/tests/**"
      instructions: |
        Check that tests validate behavior rather than implementation details.

        Security-sensitive code should include negative/failure-path coverage where
        relevant, especially for:
        - authorization and approval gates,
        - malformed/untrusted documents,
        - prompt/tool injection attempts,
        - invalid filesystem paths,
        - sandbox failures,
        - unavailable local models,
        - unsupported tool requests,
        - citation/source validation,
        - attempts to reach external services.

        Do not recommend meaningless tests purely to increase coverage numbers.

    # ───── DEPENDENCY CHANGES ─────

    - path: "**/package.json"
      instructions: |
        Scrutinize new dependencies. Flag packages that add unnecessary network
        behavior, telemetry, cloud services, overlapping functionality, large
        dependency trees, or security-sensitive capabilities.

        Verify workspace dependencies preserve the intended monorepo boundaries.

    - path: "apps/ai/pyproject.toml"
      instructions: |
        Scrutinize Python dependency additions for necessity, provenance,
        security implications, telemetry, cloud-service dependencies, and
        compatibility with the local-first architecture.

    - path: "apps/ai/*.txt"
      instructions: |
        Review dependency changes carefully. Flag cloud AI SDKs, telemetry,
        unnecessary remote-service clients, insecure packages, duplicated
        dependencies, or packages inconsistent with the locked architecture.

    # ───── CONTAINERS / SANDBOX ─────

    - path: "**/Dockerfile*"
      instructions: |
        Treat container configuration as security-sensitive.

        Review for:
        - excessive privileges,
        - running as root unnecessarily,
        - broad host filesystem mounts,
        - exposed sockets,
        - missing resource restrictions,
        - unexpected network access,
        - secrets baked into images,
        - unnecessary packages,
        - unsafe shell commands.

        WorkBench sandbox execution must remain isolated and network-disabled
        where specified by the project architecture.

    # ───── GITHUB ACTIONS ─────

    - path: ".github/workflows/**"
      instructions: |
        Review workflow changes for least privilege and supply-chain security.

        Check:
        - workflow permissions,
        - secret exposure,
        - untrusted PR input used in shell commands,
        - unsafe pull_request_target usage,
        - excessive write permissions,
        - artifact leakage,
        - third-party actions with weak provenance,
        - unnecessary deployment or publishing behavior.

    # ───── ARCHITECTURE CONTRACT ─────

    - path: "AGENTS.md"
      instructions: |
        Treat changes here as changes to the repository-wide engineering and
        security contract. Flag weakening of sovereignty, safety, architecture,
        validation, approval, or repository-boundary requirements.

    - path: "PLAN.md"
      instructions: |
        Treat changes here as architectural/product-scope decisions.
        Highlight changes that alter the locked architecture, security model,
        MVP acceptance criteria, local-only guarantees, or trust boundaries.

  # ─────────────────────────────────────────────
  # PRE-MERGE HYGIENE
  # ─────────────────────────────────────────────

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: >
        Use a concise descriptive title. Prefer prefixes such as feat:, fix:,
        refactor:, test:, docs:, chore:, security:, or ci:.

    description:
      mode: "warning"

    docstrings:
      mode: "off"

    issue_assessment:
      mode: "off"

  # ─────────────────────────────────────────────
  # STATIC / CI CONTEXT
  # ─────────────────────────────────────────────

  tools:
    github-checks:
      enabled: true
      timeout_ms: 120000

    ruff:
      enabled: true

    gitleaks:
      enabled: true

    hadolint:
      enabled: true

    yamllint:
      enabled: true

  # Keep CodeRabbit focused on reviewing rather than modifying branches.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false


# ─────────────────────────────────────────────
# CODERABBIT CHAT
# ─────────────────────────────────────────────

chat:
  art: false
  auto_reply: true

  # Public repo: don't let arbitrary GitHub users consume bot interaction.
  # Automatic PR review eligibility is unaffected.
  _non_org_members: true


# ─────────────────────────────────────────────
# REPOSITORY KNOWLEDGE
# ─────────────────────────────────────────────

knowledge_base:
  code_guidelines:
    enabled: true

  # Keep learned review preferences specific to WorkBench.
  learnings:
    scope: "local"
